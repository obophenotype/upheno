pattern_name: abnormallyDecreasedLevelOfChemicalEntityInLocation
pattern_iri: http://purl.obolibrary.org/obo/upheno/patterns-dev/abnormallyDecreasedLevelOfChemicalEntityInLocation.yaml
description: "An abnormal decrease of a chemical entity, like sodium, in a location, like the blood. Level and concentration are used interchangeably in phenotype descriptions, so this pattern also covers phenotypes reported as decreased concentration (e.g. HP:0002902 Hyponatremia, MP:0005634 decreased circulating sodium level); there is no separate concentration pattern."

contributors: 
  - https://orcid.org/0000-0003-4606-0597
  - https://orcid.org/0000-0002-9900-7880
  - https://orcid.org/0000-0001-9076-6015
  - https://orcid.org/0000-0002-3528-5267
  - https://orcid.org/0000-0001-5208-3432
  - https://orcid.org/0000-0001-7941-2961
  - https://orcid.org/0000-0003-4148-4606

classes:
  decreased amount: PATO:0001997
  abnormal: PATO:0000460
  chemical entity: CHEBI:24431
  independent continuant: BFO:0000004

relations: 
  inheres_in: RO:0000052
  has_modifier: RO:0002573
  has_part: BFO:0000051
  part_of: BFO:0000050

annotationProperties:
  exact_synonym: oio:hasExactSynonym 

vars:
  chemical_entity: "'chemical entity'"
  location: "'independent continuant'"
 
name:
  text: "decreased level of %s in %s"
  vars:
   - chemical_entity
   - location

annotations:
  - annotationProperty: exact_synonym
    text: "decreased concentration of %s in %s"
    vars:
     - chemical_entity
     - location

def:
  text: "A decrease in the level of %s in %s."
  vars:
    - chemical_entity
    - location

equivalentTo:
  text: "'has_part' some ('decreased amount' and ('inheres_in' some (%s and ('part_of' some %s))) and ('has_modifier' some 'abnormal'))"
  vars:
    - chemical_entity
    - location
